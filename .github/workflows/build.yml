name: Build LinkUp

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linkup-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-Fabric-Minecraft-26.3
          path: build/libs/linkup-*.jar
          if-no-files-found: error
          retention-days: 30
